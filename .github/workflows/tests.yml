name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - name: Package pre-workflow source revision for submission
        run: git archive --format=zip --prefix=xingyuan-sis/ -o submission-source.zip 63d936f5aec559995ad421424ccba9b79c675f48
      - uses: actions/upload-artifact@v4
        with:
          name: xingyuan-sis-submission-source
          path: submission-source.zip
